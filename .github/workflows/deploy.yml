name: Deploy to Linode

on:
  push:
    branches: [main]

# Never run two deploys at once (2026-09-16): the worker now drains for up to
# 5 minutes on stop, and a second run's compose would stop the still-draining
# container again. Queued, not cancelled — every merge still deploys.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/deploy/postautomation
            bash scripts/deploy.sh update
          command_timeout: 20m
